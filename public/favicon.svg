<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fecfef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a1c4fd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Transparent Background is default in SVG -->
  
  <!-- Outer Glow / Background Element -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#grad1)" stroke-width="6" opacity="0.8" />
  
  <!-- Sun / Spark Core -->
  <circle cx="50" cy="50" r="28" fill="url(#grad2)" />
  
  <!-- Spark Rays -->
  <path d="M 50 15 L 50 5 M 85 50 L 95 50 M 50 85 L 50 95 M 15 50 L 5 50 M 75 25 L 82 18 M 75 75 L 82 82 M 25 75 L 18 82 M 25 25 L 18 18" stroke="url(#grad2)" stroke-width="6" stroke-linecap="round" />
  
  <!-- Inner Arrow (Upward movement/Motivation) -->
  <path d="M 35 55 L 50 35 L 65 55 M 50 35 L 50 65" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
